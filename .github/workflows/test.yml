name: tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # factscribe is stdlib-only: no install, no network, no services.
      # PDF 回检依赖 poppler（pdftotext/pdfinfo）；GitHub 的 ubuntu 镜像默认没有，
      # 不装的话 PDF 相关测试在 CI 会红、在本机（homebrew 装了）却绿。
      - name: Install poppler (pdftotext)
        # GitHub 的 apt 镜像会抽风；失败三次才真失败，别让环境噪声把代码判红。
        run: |
          set -e
          for i in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq \
               && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq poppler-utils; then
              break
            fi
            echo "apt 第 $i 次失败，10 秒后重试"
            sleep 10
          done
          command -v pdftotext >/dev/null
          pdftotext -v 2>&1 | head -1

      - name: Version
        run: python -m factscribe --version

      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -v

      # Acceptance sample must stay red for exactly the reasons we document:
      # exit 1 = violations found (not 0 = false green, not 2 = broken config).
      - name: Acceptance sample fails as documented
        run: |
          set +e
          python -m factscribe audit examples/minimal
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::examples/minimal audit exit=$code, expected 1 (red)"
            exit 1
          fi

  # 第三方移植件的测试：integrations/ 不进 factscribe 包，但代码要跑。
  # 零依赖：只要求 node，不装 npm 包。
  integrations:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Node tests (integrations)
        run: node --test integrations/factgate/tests/*.test.mjs
