[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "factscribe"
dynamic = ["version"]
description = "Mechanical gate for numbers and citations in LaTeX papers: every number bound to a sha256-pinned fact, every citation pinned to a stable identifier. Offline, stdlib only."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "paperkit contributors" }]
keywords = ["latex", "reproducibility", "citations", "fact-checking", "paper"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.scripts]
factscribe = "factscribe.cli:main"

# Package layout: `factscribe/` is a normal package of stdlib-only modules.
# See docs/implementation/SPLIT-B.md for the module boundary map.
[tool.setuptools]
packages = ["factscribe"]

[tool.setuptools.dynamic]
version = { attr = "factscribe.constants.VERSION" }
