name: tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # factscribe is stdlib-only: no install, no network, no services.
      # PDF 回检依赖 poppler（pdftotext/pdfinfo）；GitHub 的 ubuntu 镜像默认没有，
      # 不装的话 PDF 相关测试在 CI 会红、在本机（homebrew 装了）却绿。
      - name: Install poppler (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Version
        run: python -m factscribe --version

      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -v

      # Acceptance sample must stay red for exactly the reasons we document:
      # exit 1 = violations found (not 0 = false green, not 2 = broken config).
      - name: Acceptance sample fails as documented
        run: |
          set +e
          python -m factscribe audit examples/minimal
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::examples/minimal audit exit=$code, expected 1 (red)"
            exit 1
          fi
