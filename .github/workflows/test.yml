name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # factscribe is stdlib-only: no install, no network, no services.
      # PDF 回检依赖 poppler（pdftotext/pdfinfo/pdfimages）；GitHub 的 ubuntu 镜像默认没有。
      # runner 的 apt 镜像常年连不上（IPv6 挂死 / 镜像超时），这一步只能**尽力而为**：
      # 装不上就警告并继续——PDF 层用例会自己跳过（tests/_pdfdep.py，输出里有 skipped= 计数），
      # 其余测试照常跑；PDF 层的全量验证由本地 ./scripts/preflight-ci.sh 覆盖。
      - name: Install poppler (best effort)
        continue-on-error: true
        timeout-minutes: 6
        # 强制 IPv4（runner 上 IPv6 常挂）+ 单次 60 秒超时 + 两次重试。
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for i in 1 2; do
            if timeout 60 sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20 -o Acquire::Retries=1 update -qq \
               && timeout 60 sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20 -o Acquire::Retries=1 install -y -qq poppler-utils; then
              break
            fi
            echo "apt 第 $i 次失败（共 2 次），10 秒后重试"
            sleep 10
          done
          if command -v pdftotext >/dev/null; then
            pdftotext -v 2>&1 | head -1
          else
            echo "::warning::poppler 未安装，PDF 层测试本轮跳过"
          fi

      - name: Version
        run: python -m factscribe --version

      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -v

      # 第三方集成件（integrations/factscribe-legal）的测试：纯标准库、离线。
      # 放进主矩阵是有意的：它的 TOML 读取层在 3.10 走自带兜底解析器、
      # 在 3.11+ 走标准库 tomllib —— 两边必须读出同一份事实账，
      # 所以这个矩阵（含 3.10）就是它的回归线。
      - name: Integration tests (offline, integrations/factscribe-legal)
        run: python -m unittest discover -s integrations/factscribe-legal/tests -v

      # Acceptance sample must stay red for exactly the reasons we document:
      # exit 1 = violations found (not 0 = false green, not 2 = broken config).
      - name: Acceptance sample fails as documented
        run: |
          set +e
          python -m factscribe audit examples/minimal
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::examples/minimal audit exit=$code, expected 1 (red)"
            exit 1
          fi

  # wheel 安装面：editable 安装读源码目录，数据文件缺了也看不出来；
  # 这里真打一个 wheel、真装进新 venv，跑会读 patterns/ 与 terms/ 的命令。
  packaging:
    name: wheel install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps -w dist
          python -m venv venv
          venv/bin/pip install dist/factscribe-*.whl

      - name: Runtime data is present
        run: |
          venv/bin/factscribe prescribe --list > /tmp/prescribe.txt
          grep -q "处方：" /tmp/prescribe.txt
          printf '这是一个中文句子，用来确认分词词典已随包安装。\n' > /tmp/zh.md
          set +e
          venv/bin/factscribe style --doc /tmp/zh.md > /tmp/style.txt 2>&1
          code=$?
          set -e
          cat /tmp/style.txt
          if [ "$code" -eq 4 ] || grep -qE "SegmentError|词表不存在|No such file" /tmp/style.txt; then
            echo "::error::wheel 缺少运行时数据文件"
            exit 1
          fi

  # 发布源（根 miniapp/）的 node 用例。
  #
  # 旧宿主 integrations/minifactscribe/ 已按第 ④ 步删除，它那一格 node job
  # 随之退场——现在这一格跑的是**真实存在**的 miniapp/tests/（保存链路的行尾
  # 保持、指纹闸、状态码透传），不引用任何已删目录。
  #
  # 这些是真引擎端到端用例：机器上没有 Python ≥3.10 时它们会 skip，一格全绿的
  # 假绿比红更坏——所以这一格把 Python 也备齐，末尾再核一遍「一份都没跳过」。
  node:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node tests (miniapp)
        run: |
          set -o pipefail
          node --test --test-reporter=tap miniapp/tests/*.test.mjs 2>&1 | tee /tmp/node-test.tap

      - name: No test was skipped
        if: always()
        run: |
          if [ ! -f /tmp/node-test.tap ]; then
            echo "::error::node 用例没产出日志——上一格就失败了"
            exit 1
          fi
          grep -E '^# (tests|pass|fail|skipped)' /tmp/node-test.tap
          if grep -qE '^# skipped [1-9]' /tmp/node-test.tap; then
            echo "::error::node 用例出现跳过——CI 里 Python ≥3.10 必须备齐（见 setup-python）"
            exit 1
          fi
