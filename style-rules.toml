# factscribe style — 文风闸的阈值与词表（全部可机械复算）
#
# 本文件是默认配置。项目根放一份同名文件即覆盖本文件的同名键；
# `factscribe style <project> --rules <path>` 可显式指定。
# 指标定义与阈值依据见 docs/implementation/STYLE-GATE.md。
#
# 定位：本工具不评估、也不试图规避任何 AI 检测器；它检测的是可机械判定的
# 公式化写作特征，只出黄牌（exit 3），不阻断、不改正文。

# 术语白名单（TERM_FIRST_IN_HEADING）：两层，先项目内 GLOSSARY.md，
# 再用户自维护的纯文本（一行一个词）；忽略空行与 # 注释，大小写不敏感。
term_allow_files = ["GLOSSARY.md", "term-allow.txt"]

# 标题关系词：改写前后标题里的这组词发生替换或删除即报
# HEADING_RELATION_CHANGED。英文按词边界，中文按子串。
heading_relation_words = ["versus", "vs", "and", "or", "not", "without",
                          "对", "与", "及", "不是"]

[thresholds]
# 每千词（中文按字）套话连接词数；> 触发
connective_density = 8.0
# 句长标准差 / 均值。健康区间 [0.45, 0.80]：
#   < 0.45 触发（太整齐／太平）；> 0.80 不报（散不是 AI 特征）
sentence_uniformity = 0.45
sentence_uniformity_high = 0.80
# 每千词空泛形容词数；> 触发
empty_adjective = 6.0
# 段末以 Therefore/Overall/Thus/综上/因此 收尾的段落占比；> 触发
paragraph_template = 0.5
# 双重以上模糊限定出现次数；>= 触发
hedge_stack = 1
# 相邻段落首词相同的次数；>= 触发
repeated_opener = 2
# 单句长度上限（词 / 字）；超过且句内没有任何从句/分号/破折号/括号断点才报。
# 又长又有结构的长句是专家写法，不报。
sentence_length_extreme_en = 60
sentence_length_extreme_zh = 110
# 节奏平台：连续 N 句长度都落在同一 W 词（字）区间即触发
rhythm_plateau_run = 3
rhythm_plateau_window = 10

# ---- v4 新增（SPEC-V3.0 §13）----
# 插入语破折号（—— / —）预算：出现数 > 预算才报；按处报，默认 0
dash_budget = 0
# 标题长度上限：中文 > 12 字、英文 > 8 词才报；\title{} 豁免
heading_max_chars_zh = 12
heading_max_words_en = 8
# 同构三点并列在相邻段落重复 >= N 次才报（不是按条数判）
colloquial_triad_repeats = 2

# ---- v5 新增（SPEC-V3.0 §15 改写后复检）----
# 首句去掉停用词后，至少要引入这么多个标题里没有的实义词；
# 少于该数视为「首句只是复述标题」（HEADING_ECHO）。
heading_echo_min_new_terms = 1

# HEADING_ECHO 的辅助词表：泛化词不算「新实义」；标题后紧跟这些垫话
# 开头视为复述式。只影响 v5 判据，顺序无关。
[heading_echo]
generic_terms_en = ["limitation", "problem", "issue", "result", "question",
                    "thing", "aspect", "case", "point", "claim", "matter",
                    "area", "topic", "subject", "part", "example", "work",
                    "study", "approach", "method", "way"]
generic_terms_zh = ["限制", "问题", "结果", "内容", "方面", "部分", "事情",
                    "情况", "因素", "要点", "工作", "研究", "方法", "做法",
                    "角度", "例子"]
meta_openers_en = ["is about", "is concerned with", "is discussed",
                   "we discuss", "this section", "this subsection",
                   "in this section", "in this subsection", "here we"]
meta_openers_zh = ["里", "中", "方面", "来说", "而言", "要先", "先要",
                   "先问", "首先要", "需要先", "本节讨论", "本节讲",
                   "这里讨论", "这一节讨论", "我们讨论", "本文讨论",
                   "讨论的是", "讲的是", "谈的是"]

[limits]
# 每个指标最多列多少条具体改法（防止报告淹没）
max_findings_per_metric = 20
# 段级统计的最小段长（词/字），过滤标题、残片与图表残留
min_paragraph_units = 8
# 少于这么多句不判「句长均匀」（短文本的 CV 无意义）
uniformity_min_sentences = 10

[connectives]
# 套话连接词：句首或句中都算，按词边界匹配
english = ["Moreover", "Furthermore", "Additionally", "In addition",
           "Overall", "In conclusion"]
chinese = ["首先", "其次", "此外", "综上所述", "总而言之"]

[empty_adjectives]
# 空泛形容词：不承载可核验信息
english = ["crucial", "robust", "comprehensive", "significant",
           "essential", "vital"]
chinese = ["至关重要", "显著", "全面", "深入"]
# 这些搭配里形容词是术语的一部分，不算空泛（避免误伤）
exempt_phrases = ["statistically significant", "robust standard error",
                  "robust to", "more robust", "less robust",
                  "significant at the"]

[paragraph_closers]
# 段末套话收尾词（看最后一句的句首）
english = ["Therefore", "Overall", "Thus", "In conclusion"]
chinese = ["综上", "因此", "总之", "总而言之", "总体而言"]

[hedge_stacks]
# 双重以上模糊限定（两层限定叠在同一处）
english = ["may potentially", "might potentially", "could potentially",
           "may possibly", "might possibly", "could possibly",
           "may conceivably", "could conceivably",
           "seems to suggest", "appears to indicate",
           "appears to suggest", "seems to indicate"]
chinese = ["可能会", "或许会", "或许能够", "也许可能", "似乎可能",
           "大概可能", "可能会是"]

[repeated_opener]
# 以虚词开头的相邻段不算「模板化同头」（否则正常学术写作会被大量误伤）
# 只报实词/短语开头的重复，例如连续三段都以 "Assembly" / "Second" 开头。
stopwords = ["the", "a", "an", "this", "that", "these", "those",
             "it", "its", "they", "their", "we", "our", "i", "in",
             "on", "for", "to", "as", "at", "by", "with", "from",
             "there", "and", "but", "or", "if", "when", "while",
             "because", "since", "of",
             "如果", "那么", "因为", "所以", "但是", "因此", "并且",
             "而且", "这", "那", "我们", "它", "其", "在", "对",
             "从", "当", "为了", "通过", "由", "被", "把", "让",
             "使", "一个", "一种", "本文", "本节", "每一", "每"]
