<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FactScribe Workbench</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><b>FactScribe</b><span>本地工作台</span></div>
      <div id="project" class="project">加载中…</div>
      <div id="verdict" class="verdict idle">未审计</div>
      <div class="actions">
        <span id="build-state" class="muted"></span>
        <button id="btn-build" class="btn" type="button">编译 PDF</button>
        <button id="btn-open-pdf" class="btn" type="button" hidden>打开 PDF</button>
        <button id="btn-audit" class="btn primary" type="button">运行审计</button>
      </div>
    </header>

    <div id="token-panel" class="token-panel" hidden>
      <b>需要 token</b>
      <span>启动 `factscribe web` 时打印在终端。</span>
      <input id="token-input" type="password" placeholder="粘贴 token" />
      <button id="btn-token" class="btn primary" type="button">连接</button>
    </div>

    <main class="layout">
      <aside class="sections">
        <div class="side-head"><span>章节</span><span id="section-count" class="muted"></span></div>
        <div id="section-list"></div>
      </aside>

      <section class="editor">
        <div class="editor-head">
          <b id="section-title">选择一个章节</b>
          <span id="save-state" class="muted"></span>
        </div>
        <textarea id="section-text" spellcheck="false" aria-label="章节内容"></textarea>
        <div class="editor-actions">
          <button id="btn-save" class="btn primary" type="button">保存本节</button>
          <span id="readonly-note" class="muted"></span>
        </div>
      </section>

      <aside class="side">
        <div class="side-head"><span>审计</span><span id="audit-meta" class="muted"></span></div>
        <div id="findings"></div>

        <details class="card" id="facts-card">
          <summary>事实账 <span id="facts-count" class="muted"></span></summary>
          <div id="facts-body"></div>
          <form id="fact-form" class="fact-form">
            <div class="form-grid">
              <label class="field">ID<input id="fact-id" required /></label>
              <label class="field">值<input id="fact-value" required placeholder="10/16" /></label>
              <label class="field wide">主张<input id="fact-claim" required placeholder="一句话说清这条事实" /></label>
              <label class="field wide">来源<input id="fact-source" list="fact-sources" required placeholder="results/…" /></label>
              <datalist id="fact-sources"></datalist>
              <label class="field">定位<input id="fact-locator" placeholder="§二 汇总表" /></label>
              <label class="field">置信度
                <select id="fact-confidence">
                  <option value="high">高</option>
                  <option value="med" selected>中</option>
                  <option value="low">低</option>
                </select>
              </label>
              <label class="field">推算父项<input id="fact-derived" placeholder="A1,A3（可选）" /></label>
              <label class="field">算式<input id="fact-expr" placeholder="(A1.num + A3.num) / (A1.den + A3.den) * 100" /></label>
              <label class="field wide">备注<input id="fact-note" placeholder="可选" /></label>
            </div>
            <div class="editor-actions">
              <button id="btn-add-fact" class="btn primary" type="submit">追加事实</button>
              <span class="muted">工具不代签：跑完会给你该抄进清单的那一行。</span>
            </div>
            <div id="fact-result" class="muted"></div>
          </form>
        </details>

        <div class="card" id="evidence-card">
          <div class="side-head"><span>证据冻结</span><span id="evidence-meta" class="muted"></span></div>
          <div id="evidence-body"></div>
          <div class="editor-actions">
            <button id="btn-freeze" class="btn" type="button">冻结</button>
            <button id="btn-unfreeze" class="btn" type="button">解冻</button>
          </div>
        </div>
      </aside>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
