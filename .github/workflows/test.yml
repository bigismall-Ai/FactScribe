name: tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # factscribe is stdlib-only: no install, no network, no services.
      # PDF 回检依赖 poppler（pdftotext/pdfinfo/pdfimages）；GitHub 的 ubuntu 镜像默认没有。
      # runner 的 apt 镜像常年连不上（IPv6 挂死 / 镜像超时），这一步只能**尽力而为**：
      # 装不上就警告并继续——PDF 层用例会自己跳过（tests/_pdfdep.py，输出里有 skipped= 计数），
      # 其余测试照常跑；PDF 层的全量验证由本地 ./scripts/preflight-ci.sh 覆盖。
      - name: Install poppler (best effort)
        continue-on-error: true
        timeout-minutes: 6
        # 强制 IPv4（runner 上 IPv6 常挂）+ 单次 60 秒超时 + 两次重试。
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for i in 1 2; do
            if timeout 60 sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20 -o Acquire::Retries=1 update -qq \
               && timeout 60 sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20 -o Acquire::Retries=1 install -y -qq poppler-utils; then
              break
            fi
            echo "apt 第 $i 次失败（共 2 次），10 秒后重试"
            sleep 10
          done
          if command -v pdftotext >/dev/null; then
            pdftotext -v 2>&1 | head -1
          else
            echo "::warning::poppler 未安装，PDF 层测试本轮跳过"
          fi

      - name: Version
        run: python -m factscribe --version

      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -v

      # Acceptance sample must stay red for exactly the reasons we document:
      # exit 1 = violations found (not 0 = false green, not 2 = broken config).
      - name: Acceptance sample fails as documented
        run: |
          set +e
          python -m factscribe audit examples/minimal
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::examples/minimal audit exit=$code, expected 1 (red)"
            exit 1
          fi

  # 第三方移植件的测试：integrations/ 不进 factscribe 包，但代码要跑。
  # 零依赖：只要求 node，不装 npm 包。
  integrations:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Node tests (integrations)
        run: node --test integrations/factgate/tests/*.test.mjs
